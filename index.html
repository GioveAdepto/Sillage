<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sillage">
<meta name="theme-color" content="#12100d">
<title>Sillage — collezione privata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sillage.css">
</head>
<body>

<header class="testata" id="testata">
  <div class="marca-app">
    <h1>Sillage</h1>
    <p class="incisa">collezione privata</p>
  </div>
  <div class="conteggio" id="conteggio">—</div>
</header>

<div class="strumenti" id="strumenti">
  <div class="riga-cerca">
    <div class="cerca">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 3.8 3.8"/></svg>
      <input type="search" id="cerca" placeholder="Cerca marca, nota, famiglia…" autocomplete="off" aria-label="Cerca nella collezione">
    </div>
    <button class="btn-filtri" id="btn-filtri" onclick="apriFiltri()" aria-label="Apri filtri e ordinamento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      Filtri<span class="bollo" id="bollo-filtri"></span>
    </button>
  </div>
  <div class="rapidi" id="rapidi"></div>
  <div class="attivi" id="attivi"></div>
</div>

<main id="vista-collezione"></main>
<section id="vista-confronta" class="vista">
  <div class="cf-vuoto" id="cf-vuoto" style="display:none">
    Il tavolo del confronto è vuoto.
    <span>Torna alla collezione e tocca il + su una teca per portarla qui.</span>
  </div>
  <div id="cf-contenuto"></div>
</section>
<section id="vista-layering" class="vista"></section>
<section id="vista-guida" class="vista"></section>
<section id="vista-acquisti" class="vista"></section>
<section id="vista-numeri" class="vista"></section>

<div class="vassoio" id="vassoio">
  <div class="caselle" id="caselle"></div>
  <div class="vassoio-testo"><strong id="vassoio-conto">0 / 3</strong><span>Fino a tre per volta</span></div>
  <button class="btn-oro" id="btn-confronta" onclick="cambiaVista('confronta')" disabled>Confronta</button>
  <button class="btn-nudo" onclick="svuotaConfronto()" aria-label="Svuota il confronto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>

<div class="fondale" id="fondale-filtri" onclick="chiudiFondale(event)">
  <div class="foglio" role="dialog" aria-modal="true" aria-label="Filtri e ordinamento">
    <div class="foglio-testa">
      <div class="maniglia"></div>
      <div class="foglio-titolo">Filtri e ordinamento</div>
      <div class="foglio-sotto" id="foglio-sotto">Tutta la collezione</div>
      <button class="foglio-chiudi" onclick="chiudiFiltri()" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="foglio-corpo" id="foglio-corpo"></div>
    <div class="foglio-piede">
      <button class="btn-ombra" onclick="azzeraTutto()">Azzera</button>
      <button class="btn-oro" onclick="chiudiFiltri()" id="btn-mostra">Mostra la collezione</button>
    </div>
  </div>
</div>

<nav class="timone">
  <button class="remo attivo" id="remo-collezione" onclick="cambiaVista('collezione')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Collezione<div class="tacca"></div></button>
  <button class="remo" id="remo-confronta" onclick="cambiaVista('confronta')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>Confronta<div class="pallino" id="pallino"></div><div class="tacca"></div></button>
  <button class="remo" id="remo-layering" onclick="cambiaVista('layering')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 3 7l9 5 9-5-9-5z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></svg>Layering<div class="tacca"></div></button>
  <button class="remo" id="remo-guida" onclick="cambiaVista('guida')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Guida<div class="tacca"></div></button>
  <button class="remo" id="remo-acquisti" onclick="cambiaVista('acquisti')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v4.5M12 16h.01"/></svg>Acquisti<div class="tacca"></div></button>
  <button class="remo" id="remo-numeri" onclick="cambiaVista('numeri')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Numeri<div class="tacca"></div></button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
