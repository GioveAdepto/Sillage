# Ogni notte rilegge i dati dal ponte verso il database (ponte/LEGGIMI.md: il
# catalogo arriva dal foglio Google, diario e residuo li comanda il database)
# e aggiorna la copia in data/*.json: e' il ripiego del sito quando il foglio
# non risponde, e la cronologia di git diventa uno storico giornaliero dei dati.
# Si fa un commit solo se qualcosa e' cambiato. Parte anche quando cambia
# questo file, per provarlo subito.
#
# Il diario si legge solo con la chiave di Sillage (segreto SILLAGE_CHIAVE in
# GitHub > Settings > Secrets and variables > Actions) e finisce nel repo
# cifrato, in data/diario.enc: il repo e' pubblico. Per rileggerlo serve la
# stessa chiave, istruzioni in apps-script/LEGGIMI.md ("La chiave di Sillage").
# Senza il segreto la copia del diario si salta, il resto va avanti.
name: Copia notturna del foglio

on:
  schedule:
    - cron: "15 2 * * *"      # 02:15 UTC, le 4 circa in Italia
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/copia-notturna.yml"]

permissions:
  contents: write

jobs:
  copia:
    runs-on: ubuntu-latest
    env:
      SILLAGE_CHIAVE: ${{ secrets.SILLAGE_CHIAVE }}
    steps:
      - uses: actions/checkout@v5
      - name: Legge il foglio e riscrive data/*.json
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          # il ponte verso il database: da quando comanda il database, l'originale del diario e' li'
          U = "https://sillage.danilo-moro96.workers.dev/api"
          CHIAVE = os.environ.get("SILLAGE_CHIAVE", "").strip()
          # Google tratta male i client senza nome: ci si presenta come un browser
          testa = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36",
                   "Accept": "application/json,text/plain,*/*"}

          def chiedi(corpo=None):
              """GET, o POST con i campi in `corpo`. Tre tentativi; None se il foglio non risponde.
              Il ponte risponde direttamente; il Web App del foglio rispondeva con un rinvio, che urllib segue."""
              ultimo = ""
              dati = urllib.parse.urlencode(corpo).encode() if corpo else None
              for tentativo in range(1, 4):
                  testo = ""
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(U, data=dati, headers=testa), timeout=90)
                      testo = r.read().decode("utf-8", "replace")
                      return json.loads(testo)
                  except urllib.error.HTTPError as e:
                      ultimo = f"HTTP {e.code}: {e.read()[:400]!r}"
                  except Exception as e:
                      # niente di quello che arriva dal diario finisce nel registro
                      ultimo = f"{type(e).__name__}: {e}" + ("" if corpo else f" — ricevuto: {testo[:400]!r}")
                  print(f"tentativo {tentativo} non riuscito: {ultimo}")
                  time.sleep(20 * tentativo)
              print("il foglio non ha risposto: " + ultimo)
              return None

          d = chiedi()
          if d is None:
              raise SystemExit("il foglio non ha risposto")
          assert isinstance(d.get("profumi"), list) and d["profumi"], "risposta senza profumi"
          for k in ("profumi", "note", "layering", "consigli"):
              if k in d:
                  with open(f"data/{k}.json", "w", encoding="utf-8", newline="\n") as f:
                      f.write(json.dumps(d[k], ensure_ascii=False, indent=1) + "\n")
          print(len(d["profumi"]), "profumi")

          # il diario: si legge solo con la chiave
          if not CHIAVE:
              print("diario saltato: manca il segreto SILLAGE_CHIAVE")
          else:
              diario = d.get("diario")
              if not isinstance(diario, list):
                  t = chiedi({"azione": "leggi", "chiave": CHIAVE})
                  diario = t.get("diario") if isinstance(t, dict) else None
              if not isinstance(diario, list):
                  print("diario saltato: il foglio non l'ha dato (chiave diversa da quella dello script?)")
              else:
                  with open(os.path.join(os.environ["RUNNER_TEMP"], "diario.json"), "w", encoding="utf-8", newline="\n") as f:
                      f.write(json.dumps(diario, ensure_ascii=False, indent=1) + "\n")
                  print(len(diario), "voci di diario")
          PY
      - name: Cifra il diario, se e' cambiato
        run: |
          nuovo="$RUNNER_TEMP/diario.json"
          [ -f "$nuovo" ] || { echo "niente diario da copiare"; exit 0; }
          cifra="-aes-256-cbc -pbkdf2 -iter 200000 -a"
          # si riscrive solo se il contenuto cambia: la cifratura cambia a ogni giro anche a parita' di diario
          if [ -f data/diario.enc ] && openssl enc -d $cifra -in data/diario.enc -pass env:SILLAGE_CHIAVE 2>/dev/null | cmp -s - "$nuovo"; then
            echo "diario invariato"
          else
            openssl enc $cifra -salt -in "$nuovo" -out data/diario.enc -pass env:SILLAGE_CHIAVE
            echo "diario aggiornato"
          fi
          rm -f "$nuovo"
      - name: Commit se ci sono differenze
        run: |
          git add data/
          if git diff --cached --quiet; then echo "niente di nuovo"; exit 0; fi
          git config user.name "sillage-bot"
          git config user.email "sillage-bot@users.noreply.github.com"
          git commit -m "Copia notturna del foglio"
          git push
