<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Flacone senza immagine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a35e" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c8a35e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c8a35e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a35e" stop-opacity="0.16"/>
      <stop offset="48%" stop-color="#c8a35e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c8a35e" stop-opacity="0.13"/>
    </linearGradient>
    <radialGradient id="niche" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1e1a14"/>
      <stop offset="100%" stop-color="#12100d"/>
    </radialGradient>
  </defs>

  <rect width="400" height="520" rx="18" fill="url(#niche)"/>
  <rect x="0.75" y="0.75" width="398.5" height="518.5" rx="17.25" fill="none" stroke="#c8a35e" stroke-opacity="0.22"/>

  <ellipse cx="200" cy="252" rx="128" ry="176" fill="url(#glow)"/>

  <!-- flacone stilizzato -->
  <g stroke="#c8a35e" stroke-opacity="0.55" fill="url(#glass)" stroke-width="1.6">
    <rect x="182" y="112" width="36" height="34" rx="4"/>
    <rect x="192" y="146" width="16" height="22"/>
    <rect x="134" y="168" width="132" height="204" rx="12"/>
  </g>
  <line x1="152" y1="196" x2="152" y2="348" stroke="#c8a35e" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>

  <!-- riflesso -->
  <path d="M134 300 Q200 282 266 300" fill="none" stroke="#c8a35e" stroke-opacity="0.14" stroke-width="1.2"/>

  <text x="200" y="424" text-anchor="middle" font-family="Marcellus, 'Times New Roman', serif" font-size="19" letter-spacing="3.4" fill="#c8a35e" fill-opacity="0.82">IMMAGINE</text>
  <text x="200" y="450" text-anchor="middle" font-family="Marcellus, 'Times New Roman', serif" font-size="19" letter-spacing="3.4" fill="#c8a35e" fill-opacity="0.82">IN ARRIVO</text>

  <line x1="150" y1="470" x2="250" y2="470" stroke="#c8a35e" stroke-opacity="0.3" stroke-width="1"/>
  <text x="200" y="492" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="11" letter-spacing="1.6" fill="#c8a35e" fill-opacity="0.5">SILLAGE</text>
